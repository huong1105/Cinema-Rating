openapi: 3.0.3
info:
  title: CineRate API - Phase 1 Baseline
  description: |
    REST API backend cho dịch vụ đánh giá phim CineRate (Phase 1).
    Phục vụ làm sản phẩm cơ sở cho bài toán môn Kiến trúc Phần mềm (KTPM).
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Đăng ký, Đăng nhập & Profile
  - name: Movies
    description: Xem danh sách, chi tiết, thêm & xóa phim
  - name: Genres
    description: Thể loại phim
  - name: Ratings & Reviews
    description: Đánh giá điểm và viết nhận xét bình luận
  - name: Watchlist
    description: Danh sách phim muốn xem sau của người dùng

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Genre:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Action

    MovieGenreRelation:
      type: object
      required: [id, movieId, genreId, genre]
      properties:
        id:
          type: integer
          example: 2
        movieId:
          type: integer
          example: 1
        genreId:
          type: integer
          example: 1
        genre:
          $ref: '#/components/schemas/Genre'

    Movie:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Inception
        overview:
          type: string
          nullable: true
          example: A thief who steals corporate secrets through dream-sharing technology.
        director:
          type: string
          nullable: true
          example: Christopher Nolan
        releaseYear:
          type: integer
          nullable: true
          example: 2010
        createdAt:
          type: string
          format: date-time
          example: '2026-10-27T10:23:27.904Z'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/MovieGenreRelation'

    CreateMovieInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: Interstellar
        overview:
          type: string
          example: Explorers travel through a wormhole in space to ensure humanity's survival.
        director:
          type: string
          example: Christopher Nolan
        releaseYear:
          type: integer
          minimum: 1888
          example: 2014
        genreIds:
          type: array
          items:
            type: integer
          example: [10]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              required: [message]
              properties:
                message:
                  type: string
    MoviePreview:
      type: object
      required: [id, title, releaseYear]
      properties:
        id:
          type: integer
        title:
          type: string
        releaseYear:
          type: integer
          nullable: true
    PublicAuthor:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string
    Rating:
      type: object
      required: [id, userId, movieId, score, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        movieId:
          type: integer
        score:
          type: number
          minimum: 1
          maximum: 10
        createdAt:
          type: string
          format: date-time
    RatingWithMovie:
      allOf:
        - $ref: '#/components/schemas/Rating'
        - type: object
          required: [movie]
          properties:
            movie:
              $ref: '#/components/schemas/MoviePreview'
    RatingSummary:
      type: object
      required: [averageRating, ratingCount]
      properties:
        averageRating:
          type: number
          nullable: true
          description: Null khi phim chưa có lượt chấm điểm.
        ratingCount:
          type: integer
          minimum: 0
    Review:
      type: object
      required: [id, userId, movieId, content, createdAt, user]
      properties:
        id:
          type: integer
        userId:
          type: integer
        movieId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/PublicAuthor'
    WatchlistItem:
      type: object
      required: [id, userId, movieId, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        movieId:
          type: integer
        createdAt:
          type: string
          format: date-time
    WatchlistItemWithMovie:
      allOf:
        - $ref: '#/components/schemas/WatchlistItem'
        - type: object
          required: [movie]
          properties:
            movie:
              $ref: '#/components/schemas/MoviePreview'
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

  parameters:
    MovieId:
      in: path
      name: id
      required: true
      description: ID số nguyên dương dạng thập phân; không nhận 1e2, 0x10 hay 1.0.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    ReviewId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    WatchlistMovieId:
      in: path
      name: movieId
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647

  responses:
    BadRequest:
      description: Dữ liệu hoặc ID không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: ID phim không hợp lệ
    Unauthorized:
      description: Thiếu JWT, JWT hết hạn hoặc thông tin đăng nhập không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Token không hợp lệ hoặc đã hết hạn.
    Forbidden:
      description: Chỉ tác giả mới được xóa bài đánh giá.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Bạn không có quyền xóa bài đánh giá của người khác
    NotFound:
      description: Không tìm thấy phim, người dùng hoặc bản ghi cần thao tác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Không tìm thấy phim
    Conflict:
      description: Phim đã có trong Watchlist của người dùng hiện tại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Phim đã có trong Watchlist
    InternalServerError:
      description: Lỗi máy chủ; production không trả chi tiết database hoặc stack.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Internal Server Error

paths:
  /health:
    get:
      summary: Kiểm tra trạng thái server
      responses:
        '200':
          description: OK

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email:
                  type: string
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Đăng ký thành công

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập cấp JWT Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Đăng nhập thành công

  /api/auth/profile:
    get:
      tags: [Auth]
      summary: Xem thông tin cá nhân (Cần Auth)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin user
    put:
      tags: [Auth]
      summary: cập nhật thông tin cá nhân hoặc đổi mật khẩu (Cần Auth)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Sai mật khẩu hoặc thông tin không hợp lệ
        '401':
          description: chưa đăng nhập
        '409':
          description: email mới đã được sử dụng

  /api/movies:
    get:
      tags: [Movies]
      summary: Lấy danh sách phim kèm thể loại
      description: Trả về danh sách tất cả các bộ phim trong hệ thống kèm thể loại liên kết, sắp xếp theo ID tăng dần.
      responses:
        '200':
          description: Danh sách phim kèm thể loại
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
              example:
                data:
                  - id: 1
                    title: Inception
                    overview: A thief who steals corporate secrets through dream-sharing technology.
                    director: Christopher Nolan
                    releaseYear: 2010
                    createdAt: '2026-10-27T10:23:27.904Z'
                    genres:
                      - id: 2
                        movieId: 1
                        genreId: 1
                        genre:
                          id: 1
                          name: Action
                      - id: 1
                        movieId: 1
                        genreId: 10
                        genre:
                          id: 10
                          name: Science Fiction
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Movies]
      summary: Thêm phim mới (Cần Auth)
      description: Tạo mới một bộ phim trong hệ thống. Cần đăng nhập (Bearer token). Hỗ trợ liên kết danh sách thể loại qua mảng genreIds.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovieInput'
            example:
              title: Interstellar
              overview: Explorers travel through a wormhole in space to ensure humanity's survival.
              director: Christopher Nolan
              releaseYear: 2014
              genreIds: [10]
      responses:
        '201':
          description: Tạo phim thành công
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    example: Tạo phim thành công
                  data:
                    $ref: '#/components/schemas/Movie'
              example:
                message: Tạo phim thành công
                data:
                  id: 2
                  title: Interstellar
                  overview: Explorers travel through a wormhole in space to ensure humanity's survival.
                  director: Christopher Nolan
                  releaseYear: 2014
                  createdAt: '2026-10-27T10:23:27.905Z'
                  genres:
                    - id: 3
                      movieId: 2
                      genreId: 10
                      genre:
                        id: 10
                        name: Science Fiction
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/movies/{id}:
    get:
      tags: [Movies]
      summary: Xem chi tiết phim
      description: Lấy thông tin chi tiết của một bộ phim theo ID kèm danh sách thể loại liên kết.
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '200':
          description: Chi tiết phim
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Movie'
              example:
                data:
                  id: 1
                  title: Inception
                  overview: A thief who steals corporate secrets through dream-sharing technology.
                  director: Christopher Nolan
                  releaseYear: 2010
                  createdAt: '2026-10-27T10:23:27.904Z'
                  genres:
                    - id: 2
                      movieId: 1
                      genreId: 1
                      genre:
                        id: 1
                        name: Action
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Movies]
      summary: Xóa phim (Cần Auth)
      description: Xóa một bộ phim theo ID khỏi hệ thống. Tự động xóa tầng (Cascade) các ratings, reviews, watchlist liên quan. Cần quyền đăng nhập (Bearer token).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '200':
          description: Xóa phim thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Xóa phim thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/genres:
    get:
      tags: [Genres]
      summary: Lấy danh sách thể loại phim
      description: Trả về danh sách tất cả các thể loại phim có trong hệ thống, sắp xếp theo ID tăng dần.
      responses:
        '200':
          description: Danh sách thể loại
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Genre'
              example:
                data:
                  - id: 1
                    name: Action
                  - id: 2
                    name: Adventure
                  - id: 10
                    name: Science Fiction
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/movies/{id}/ratings:
    post:
      tags: [Ratings & Reviews]
      summary: Chấm hoặc chấm lại điểm phim từ 1 đến 10
      description: Mỗi user có một rating cho mỗi phim. Chấm lại cập nhật bản ghi hiện tại. User được lấy từ JWT, bỏ qua userId trong body.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MovieId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: number
                  minimum: 1
                  maximum: 10
                  example: 8.5
      responses:
        '200':
          description: Chấm điểm hoặc cập nhật điểm thành công.
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Rating'
              example:
                message: Chấm điểm thành công
                data: {id: 1, userId: 1, movieId: 1, score: 8.5, createdAt: '2026-10-24T00:00:00.000Z'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/movies/{id}/ratings/summary:
    get:
      tags: [Ratings & Reviews]
      summary: Xem điểm trung bình và số lượt chấm điểm của phim
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '200':
          description: Tổng hợp điểm; phim chưa có rating trả averageRating null và ratingCount 0.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RatingSummary'
              examples:
                rated:
                  value: {data: {averageRating: 8.5, ratingCount: 2}}
                unrated:
                  value: {data: {averageRating: null, ratingCount: 0}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/ratings/me:
    get:
      tags: [Ratings & Reviews]
      summary: Xem các phim người dùng hiện tại đã chấm điểm
      description: Chỉ gồm điểm hiện tại của từng phim, sắp theo createdAt giảm dần rồi id giảm dần; không phải nhật ký mọi lần đổi điểm.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách rating kèm thông tin phim; có thể rỗng.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RatingWithMovie'
              example:
                data:
                  - {id: 1, userId: 1, movieId: 1, score: 8.5, createdAt: '2026-10-24T00:00:00.000Z', movie: {id: 1, title: Inception, releaseYear: 2010}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/movies/{id}/reviews:
    get:
      tags: [Ratings & Reviews]
      summary: Xem danh sách bình luận/nhận xét của một phim
      description: Công khai; sắp theo createdAt giảm dần rồi id giảm dần. Thông tin tác giả chỉ gồm id và username.
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '200':
          description: Danh sách bình luận; phim chưa có bình luận trả mảng rỗng.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
              example:
                data:
                  - {id: 1, userId: 1, movieId: 1, content: Phim rất hay, createdAt: '2026-10-24T00:00:00.000Z', user: {id: 1, username: testuser}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Ratings & Reviews]
      summary: Viết bình luận/nhận xét cho phim (Cần Auth)
      description: Content phải là chuỗi có ít nhất 5 ký tự sau trim. Một user có thể viết nhiều review cho cùng phim. UserId chỉ lấy từ JWT.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MovieId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 5
                  example: "Phim rất hay, kỹ xảo xuất sắc và cốt truyện bất ngờ!"
      responses:
        '201':
          description: Gửi bình luận thành công
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Review'
              example:
                message: Tạo bài đánh giá thành công
                data: {id: 1, userId: 1, movieId: 1, content: Phim rất hay, createdAt: '2026-10-24T00:00:00.000Z', user: {id: 1, username: testuser}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/reviews/{id}:
    delete:
      tags: [Ratings & Reviews]
      summary: Xóa bài đánh giá do chính người dùng viết
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Đã xóa bài đánh giá.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example: {message: Xóa bài đánh giá thành công}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/watchlist:
    get:
      tags: [Watchlist]
      summary: Lấy danh sách phim muốn xem của người dùng hiện tại (Cần Auth)
      description: Sắp theo createdAt giảm dần rồi id giảm dần. Chỉ đọc dữ liệu của user trong JWT.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách phim trong Watchlist
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WatchlistItemWithMovie'
              example:
                data:
                  - {id: 1, userId: 1, movieId: 1, createdAt: '2026-10-24T00:00:00.000Z', movie: {id: 1, title: Inception, releaseYear: 2010}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Watchlist]
      summary: Thêm phim vào danh sách xem sau (Cần Auth)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movieId]
              properties:
                movieId:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  example: 1
      responses:
        '201':
          description: Đã thêm vào Watchlist
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/WatchlistItem'
              example:
                message: Đã thêm phim vào Watchlist
                data: {id: 1, userId: 1, movieId: 1, createdAt: '2026-10-24T00:00:00.000Z'}
