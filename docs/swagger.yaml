openapi: 3.0.3
info:
  title: CineRate API - Phase 1 Baseline
  description: |
    REST API backend cho dịch vụ đánh giá phim CineRate (Phase 1).
    Phục vụ làm sản phẩm cơ sở cho bài toán môn Kiến trúc Phần mềm (KTPM).
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Đăng ký, Đăng nhập & Profile
  - name: Movies
    description: Xem danh sách, chi tiết, thêm & xóa phim
  - name: Genres
    description: Thể loại phim
  - name: Ratings & Reviews
    description: Đánh giá điểm và viết nhận xét bình luận
  - name: Watchlist
    description: Danh sách phim muốn xem sau của người dùng

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Movie:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        overview:
          type: string
        director:
          type: string
        releaseYear:
          type: integer
        genres:
          type: array
          items:
            type: string

paths:
  /health:
    get:
      summary: Kiểm tra trạng thái server
      responses:
        '200':
          description: OK

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email:
                  type: string
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Đăng ký thành công

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập cấp JWT Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Đăng nhập thành công

  /api/auth/profile:
    get:
      tags: [Auth]
      summary: Xem thông tin cá nhân (Cần Auth)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin user
    put:
      tags: [Auth]
      summary: cập nhật thông tin cá nhân hoặc đổi mật khẩu (Cần Auth)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Sai mật khẩu hoặc thông tin không hợp lệ
        '401':
          description: chưa đăng nhập
        '409':
          description: email mới đã được sử dụng

  /api/movies:
    get:
      tags: [Movies]
      summary: Lấy danh sách phim
      responses:
        '200':
          description: Danh sách phim kèm thể loại
    post:
      tags: [Movies]
      summary: Thêm phim mới (Cần Auth)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                overview:
                  type: string
                director:
                  type: string
                releaseYear:
                  type: integer
                genreIds:
                  type: array
                  items:
                    type: integer
      responses:
        '201':
          description: Tạo phim thành công

  /api/movies/{id}:
    get:
      tags: [Movies]
      summary: Xem chi tiết phim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chi tiết phim
    delete:
      tags: [Movies]
      summary: Xóa phim (Cần Auth)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Xóa phim thành công

  /api/genres:
    get:
      tags: [Genres]
      summary: Lấy danh sách thể loại phim
      responses:
        '200':
          description: Danh sách thể loại

  /api/movies/{id}/ratings:
    post:
      tags: [Ratings & Reviews]
      summary: Chấm điểm đánh giá phim (Thang điểm 1 - 10)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: number
                  minimum: 1
                  maximum: 10
                  example: 8.5
      responses:
        '200':
          description: Chấm điểm thành công
        '400':
          description: Điểm không hợp lệ (phải từ 1 đến 10)
        '401':
          description: Chưa đăng nhập

  /api/movies/{id}/reviews:
    get:
      tags: [Ratings & Reviews]
      summary: Xem danh sách bình luận/nhận xét của một phim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Danh sách bình luận
    post:
      tags: [Ratings & Reviews]
      summary: Viết bình luận/nhận xét cho phim (Cần Auth)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  example: "Phim rất hay, kỹ xảo xuất sắc và cốt truyện bất ngờ!"
      responses:
        '201':
          description: Gửi bình luận thành công
        '401':
          description: Chưa đăng nhập

  /api/watchlist:
    get:
      tags: [Watchlist]
      summary: Lấy danh sách phim muốn xem của người dùng hiện tại (Cần Auth)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách phim trong Watchlist
        '401':
          description: Chưa đăng nhập
    post:
      tags: [Watchlist]
      summary: Thêm phim vào danh sách xem sau (Cần Auth)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movieId]
              properties:
                movieId:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Đã thêm vào Watchlist
        '409':
          description: Phim đã có trong Watchlist
        '401':
          description: Chưa đăng nhập

  /api/watchlist/{movieId}:
    delete:
      tags: [Watchlist]
      summary: Xóa phim khỏi danh sách xem sau (Cần Auth)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: movieId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Xóa khỏi Watchlist thành công
        '401':
          description: Chưa đăng nhập
