<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
  <title id="title">Architecture phase comparison</title>
  <desc id="desc">Phase one uses one process, no cache, and the SQLite default journal; phase two proposes cluster workers, cache and CQRS, and WAL mode.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:22px;font-weight:700}.head{font-size:17px;font-weight:700}.node{font-size:14px;font-weight:700}</style>
  </defs>
  <rect width="1100" height="510" rx="18" fill="#f8fafc"/>
  <text x="550" y="40" text-anchor="middle" class="title">Từ Pha 1 hiện tại đến các hướng cải tiến Pha 2</text>
  <rect x="45" y="76" width="390" height="365" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="112" text-anchor="middle" class="head">Pha 1 — hiện tại</text>
  <rect x="90" y="140" width="300" height="70" rx="12" fill="#e2e8f0"/><text x="240" y="182" text-anchor="middle" class="node">1 process · 1 CPU core</text>
  <rect x="90" y="245" width="300" height="70" rx="12" fill="#e2e8f0"/><text x="240" y="287" text-anchor="middle" class="node">3 tầng · chưa có cache</text>
  <rect x="90" y="350" width="300" height="58" rx="12" fill="#e2e8f0"/><text x="240" y="385" text-anchor="middle" class="node">SQLite · journal mặc định</text>
  <rect x="665" y="76" width="390" height="365" rx="18" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="860" y="112" text-anchor="middle" class="head">Pha 2 — đề xuất</text>
  <rect x="710" y="140" width="300" height="70" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="860" y="182" text-anchor="middle" class="node">Cluster · nhiều worker</text>
  <rect x="710" y="245" width="300" height="70" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="860" y="287" text-anchor="middle" class="node">Cache · CQRS read path</text>
  <rect x="710" y="350" width="300" height="58" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="860" y="385" text-anchor="middle" class="node">SQLite WAL</text>
  <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="435" y1="175" x2="700" y2="175"/><line x1="435" y1="280" x2="700" y2="280"/><line x1="435" y1="379" x2="700" y2="379"/>
  </g>
</svg>
