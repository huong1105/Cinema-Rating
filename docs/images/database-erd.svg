<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">CineRate database relationships</title>
  <desc id="desc">Seven SQLite tables for users, movies, genres, ratings, reviews, watchlist, and the movie genre join table.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}.head{font-size:16px;font-weight:700;fill:#fff}.field{font-size:13px;fill:#334155}.rel{font-size:12px;fill:#475569;font-weight:700}
    </style>
  </defs>
  <rect width="1320" height="650" rx="18" fill="#f8fafc"/>
  <text x="660" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">CineRate — mô hình dữ liệu (7 bảng)</text>
  <!-- Relationships are drawn first so they stay behind the table cards. -->
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M180 220 V300 H180 V365"/>
    <path d="M300 200 V280 H490 V365"/>
    <path d="M290 220 V320 H800 V365"/>
    <path d="M590 220 V270 H180 V365"/>
    <path d="M590 220 V365"/>
    <path d="M700 220 V300 H800 V365"/>
    <path d="M700 220 V255 H1120 V365"/>
    <path d="M1070 220 V320 H1120 V365"/>
  </g>
  <g class="rel">
    <text x="188" y="292">1:N</text><text x="385" y="272">1:N</text>
    <text x="535" y="312">1:N</text><text x="400" y="262">1:N</text>
    <text x="600" y="300">1:N</text><text x="730" y="292">1:N</text>
    <text x="875" y="248">1:N</text><text x="1080" y="292">1:N</text>
  </g>
  <g>
    <rect x="55" y="70" width="250" height="150" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <path d="M55 80 Q55 70 65 70 H295 Q305 70 305 80 V104 H55 Z" fill="#2563eb"/>
    <text x="180" y="94" text-anchor="middle" class="head">users</text>
    <text x="72" y="129" class="field">id · PK</text><text x="72" y="153" class="field">email · UNIQUE</text><text x="72" y="177" class="field">username · UNIQUE</text><text x="72" y="201" class="field">passwordHash, createdAt</text>

    <rect x="465" y="70" width="250" height="150" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <path d="M465 80 Q465 70 475 70 H705 Q715 70 715 80 V104 H465 Z" fill="#16a34a"/>
    <text x="590" y="94" text-anchor="middle" class="head">movies</text>
    <text x="482" y="129" class="field">id · PK</text><text x="482" y="153" class="field">title</text><text x="482" y="177" class="field">overview, director</text><text x="482" y="201" class="field">releaseYear, createdAt</text>

    <rect x="945" y="70" width="250" height="150" rx="10" fill="#fff" stroke="#9333ea" stroke-width="2"/>
    <path d="M945 80 Q945 70 955 70 H1185 Q1195 70 1195 80 V104 H945 Z" fill="#9333ea"/>
    <text x="1070" y="94" text-anchor="middle" class="head">genres</text>
    <text x="962" y="139" class="field">id · PK</text><text x="962" y="165" class="field">name · UNIQUE</text>

    <rect x="55" y="365" width="250" height="150" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
    <path d="M55 375 Q55 365 65 365 H295 Q305 365 305 375 V399 H55 Z" fill="#0284c7"/>
    <text x="180" y="389" text-anchor="middle" class="head">ratings</text>
    <text x="72" y="424" class="field">id · PK</text><text x="72" y="448" class="field">userId · FK, movieId · FK</text><text x="72" y="472" class="field">score, createdAt</text><text x="72" y="496" class="field">UNIQUE(userId, movieId)</text>

    <rect x="365" y="365" width="250" height="150" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/>
    <path d="M365 375 Q365 365 375 365 H605 Q615 365 615 375 V399 H365 Z" fill="#ea580c"/>
    <text x="490" y="389" text-anchor="middle" class="head">reviews</text>
    <text x="382" y="424" class="field">id · PK</text><text x="382" y="448" class="field">userId · FK, movieId · FK</text><text x="382" y="472" class="field">content, createdAt</text>

    <rect x="675" y="365" width="250" height="150" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <path d="M675 375 Q675 365 685 365 H915 Q925 365 925 375 V399 H675 Z" fill="#0f766e"/>
    <text x="800" y="389" text-anchor="middle" class="head">watchlist</text>
    <text x="692" y="424" class="field">id · PK</text><text x="692" y="448" class="field">userId · FK, movieId · FK</text><text x="692" y="472" class="field">createdAt</text><text x="692" y="496" class="field">UNIQUE(userId, movieId)</text>

    <rect x="995" y="365" width="250" height="150" rx="10" fill="#fff" stroke="#be123c" stroke-width="2"/>
    <path d="M995 375 Q995 365 1005 365 H1235 Q1245 365 1245 375 V399 H995 Z" fill="#be123c"/>
    <text x="1120" y="389" text-anchor="middle" class="head">movie_genres</text>
    <text x="1012" y="424" class="field">id · PK</text><text x="1012" y="448" class="field">movieId · FK, genreId · FK</text><text x="1012" y="472" class="field">UNIQUE(movieId, genreId)</text>
  </g>
  <text x="660" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Quan hệ movie_genres nối movies và genres; ratings/watchlist giới hạn mỗi user một bản ghi trên mỗi phim.</text>
</svg>
