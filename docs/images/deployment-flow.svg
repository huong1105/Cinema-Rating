<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">CineRate Docker build and deployment flow</title>
  <desc id="desc">Three Docker build stages produce a runtime image. The container applies Prisma migrations before starting the API and stores the SQLite database in a named volume.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .body { font: 15px Arial, sans-serif; fill: #334155; }
      .note { font: 14px Arial, sans-serif; fill: #475569; }
      .card { stroke-width: 1.5; rx: 12; }
      .arrow { stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="390" fill="#f8fafc" rx="16"/>
  <text x="40" y="42" class="title">Luồng build image và khởi chạy CineRate</text>

  <rect x="40" y="70" width="260" height="170" class="card" fill="#ecfdf5" stroke="#34d399"/>
  <text x="60" y="105" class="heading">1. Base image</text>
  <text x="60" y="145" class="body">node:20-alpine</text>
  <text x="60" y="172" class="body">Cài OpenSSL</text>
  <text x="60" y="199" class="body">WORKDIR /app</text>

  <line x1="302" y1="155" x2="340" y2="155" class="arrow"/>

  <rect x="350" y="70" width="260" height="170" class="card" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="370" y="105" class="heading">2. Builder</text>
  <text x="370" y="145" class="body">Sao chép package*.json</text>
  <text x="370" y="172" class="body">và prisma/</text>
  <text x="370" y="199" class="body">npm ci · prisma generate</text>

  <line x1="612" y1="155" x2="650" y2="155" class="arrow"/>

  <rect x="660" y="70" width="260" height="170" class="card" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="680" y="105" class="heading">3. Runtime image</text>
  <text x="680" y="145" class="body">NODE_ENV=production</text>
  <text x="680" y="172" class="body">node_modules · prisma/</text>
  <text x="680" y="199" class="body">src/ · docs/ · port 3000</text>

  <line x1="922" y1="155" x2="960" y2="155" class="arrow"/>

  <rect x="970" y="70" width="270" height="170" class="card" fill="#fff7ed" stroke="#fb923c"/>
  <text x="990" y="105" class="heading">Container khởi động</text>
  <text x="990" y="145" class="body">prisma migrate deploy</text>
  <text x="990" y="172" class="body">→ node src/server.js</text>
  <text x="990" y="199" class="body">HTTP server nghe cổng 3000</text>

  <line x1="1105" y1="240" x2="1105" y2="270" stroke="#64748b" stroke-width="2"/>
  <rect x="850" y="270" width="390" height="58" class="card" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="870" y="295" class="heading" style="font-size:16px">Docker volume: sqlite-data</text>
  <text x="870" y="316" class="note">Mount tại /app/data · database: prod.db</text>

  <text x="40" y="365" class="note">Compose ánh xạ host port (mặc định 3000) vào container port 3000 · restart: unless-stopped</text>
</svg>
