<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CineRate layered architecture</title>
  <desc id="desc">Client requests pass through presentation, business, and data access layers to Prisma and SQLite.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}.label{font-size:17px;font-weight:700}.detail{font-size:14px;fill:#475569}.small{font-size:12px;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="label" font-size="22">CineRate — kiến trúc phân tầng</text>
  <line x1="145" y1="178" x2="190" y2="178" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="390" y1="178" x2="425" y2="178" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="590" y1="178" x2="625" y2="178" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="820" y1="178" x2="855" y2="178" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="965" y1="178" x2="1000" y2="178" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="88" cy="178" r="56" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="88" y="184" text-anchor="middle" class="label">Client</text>
  <rect x="195" y="112" width="195" height="132" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="292" y="145" text-anchor="middle" class="label">Presentation</text>
  <text x="292" y="178" text-anchor="middle" class="detail">Routes · Middleware</text>
  <text x="292" y="200" text-anchor="middle" class="detail">Controllers</text>
  <rect x="430" y="112" width="160" height="132" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="158" text-anchor="middle" class="label">Business</text>
  <text x="510" y="185" text-anchor="middle" class="detail">Services</text>
  <rect x="630" y="112" width="190" height="132" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="725" y="158" text-anchor="middle" class="label">Data access</text>
  <text x="725" y="185" text-anchor="middle" class="detail">Repositories</text>
  <rect x="860" y="132" width="105" height="92" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="912" y="184" text-anchor="middle" class="label">Prisma</text>
  <rect x="1005" y="132" width="145" height="92" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <ellipse cx="1077" cy="150" rx="53" ry="12" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <path d="M1024 150 v48 c0 7 24 13 53 13 s53-6 53-13 v-48" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <path d="M1024 174 c0 7 24 13 53 13 s53-6 53-13" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1077" y="184" text-anchor="middle" class="label">SQLite</text>
  <text x="292" y="276" text-anchor="middle" class="small">Nhận và trả HTTP</text>
  <text x="510" y="276" text-anchor="middle" class="small">Quy tắc nghiệp vụ</text>
  <text x="725" y="276" text-anchor="middle" class="small">Truy vấn dữ liệu</text>
</svg>
